<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reporting Dashboard Demo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f4f6;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #f97316;
        --accent-contrast: #ffffff;
        --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.4;
      }

      .app-layout {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 240px;
        background: #111827;
        color: #f9fafb;
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .sidebar-header {
        font-weight: 600;
        font-size: 16px;
        padding: 8px 10px;
      }

      .sidebar-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .sidebar-item {
        padding: 10px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.1s ease;
      }

      .sidebar-item:hover {
        background: rgba(255, 255, 255, 0.08);
        transform: translateY(-1px);
      }

      .sidebar-item.active {
        background: var(--accent);
        color: var(--accent-contrast);
        box-shadow: 0 6px 12px rgba(249, 115, 22, 0.35);
      }

      .dashboard {
        flex: 1;
        padding: 24px 32px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .page-title {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 16px;
      }

      .section {
        margin-bottom: 32px;
      }

      .section-title {
        margin: 0 0 12px 0;
        font-size: 17px;
        font-weight: 600;
      }

      .kpi-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      .kpi-card {
        background: var(--card);
        border-radius: 12px;
        padding: 16px 18px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        min-width: 220px;
        flex: 1 1 220px;
      }

      .kpi-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .kpi-value {
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
      }

      .kpi-subtitle {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
      }

      .chart-card {
        background: var(--card);
        border-radius: 12px;
        padding: 12px 16px;
        border: 1px solid var(--border);
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        margin-top: 12px;
      }

      .chart-title {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      @media (max-width: 900px) {
        .app-layout {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          flex-direction: row;
          align-items: center;
          gap: 8px;
        }

        .sidebar-list {
          flex-direction: row;
        }

        .dashboard {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <div id="root"></div>
    </div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
